name: Build Japanese UI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build both .NET Framework targets
        run: dotnet build BetterClearTypeTuner/BetterClearTypeTuner.csproj -c Release -m:1
      - uses: actions/upload-artifact@v4
        with:
          name: BetterClearTypeTuner-ja
          path: Releases/BetterClearTypeTuner-ja STAGING.zip
          if-no-files-found: error
